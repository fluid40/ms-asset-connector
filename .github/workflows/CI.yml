name: CI

on:
  push:
    branches:
      - dk/dockerization-pipeline

permissions:
  contents: write   # to push tag and new version

jobs:
  build-image:
    runs-on: ubuntu-latest
    name: Build docker image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get next version from pyproject.toml
        id: semver
        run: |
          # Get version from pyproject.toml
          BASE_VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "Base Version: $BASE_VERSION"

          MAJOR=$(echo $BASE_VERSION | cut -d. -f1)
          MINOR=$(echo $BASE_VERSION | cut -d. -f2)
          PATCH=$(echo $BASE_VERSION | cut -d. -f3)

          NEW_PATCH=$((PATCH+1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_TAG="v$NEW_VERSION"

          GIT_HASH=$(git rev-parse --short HEAD)

          echo "New Version: $NEW_VERSION"
          echo "New Tag: $NEW_TAG"
          echo "Git Hash: $GIT_HASH"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT

      - name: Build and push fluid-asset-connector-python image
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile
          push: true
          tags: |
            engineeringmethodsag/fluid-asset-connector-python:latest
            engineeringmethodsag/fluid-asset-connector-python:${{ steps.semver.outputs.version }}-${{ steps.semver.outputs.hash }}

      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git tag ${{ steps.semver.outputs.tag }}
          git push origin ${{ steps.semver.outputs.tag }}

      - name: Update pyproject.toml with new version
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ steps.semver.outputs.version }}\"/" pyproject.toml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.semver.outputs.version }}"
          git push origin HEAD:dk/dockerization-pipeline
