name: CI

on:
  push:
    branches:
      - dk/dockerization-pipeline

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      VERSION_MAJOR_MINOR: ${{ vars.VERSION_MAJOR_MINOR }}
      VERSION_PATCH: ${{ vars.VERSION_PATCH }}
      GITHUB_TOKEN_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          MAJOR_MINOR=${VERSION_MAJOR_MINOR}
          PATCH=${VERSION_PATCH}
          echo "Current version $MAJOR_MINOR.$PATCH"

          # update patch number
          PATCH=$((PATCH + 1))

          VERSION="$MAJOR_MINOR.$PATCH"
          echo "New version $VERSION"

          # Git Hash (kurz)
          GIT_HASH=$(git rev-parse --short HEAD)

          echo "Git Hash: $GIT_HASH"

          # Outputs setzen
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT

      - name: Show Docker tags
        run: |
          echo "Docker Tags:"
          echo "latest"
          echo "${{ steps.version.outputs.version }}"
          echo "${{ steps.version.outputs.version }}-${{ steps.version.outputs.hash }}"

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile
          push: true
          tags: |
            engineeringmethodsag/fluid-asset-connector-python:latest
            engineeringmethodsag/fluid-asset-connector-python:${{ steps.version.outputs.version }}-${{ steps.version.outputs.hash }}
