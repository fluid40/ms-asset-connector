name: CI

on:
  push:
    branches:
      - dk/dockerization-pipeline

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      VERSION_MAJOR_MINOR: ${{ vars.VERSION_MAJOR_MINOR }}
      VERSION_PATCH: ${{ vars.VERSION_PATCH }}
      GITHUB_TOKEN_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          # Major/Minor sauber extrahieren
          MAJOR=$(echo $VERSION_MAJOR_MINOR | cut -d. -f1)
          MINOR=$(echo $VERSION_MAJOR_MINOR | cut -d. -f2)

          # Patch hochzählen (Default 0)
          PATCH=${VERSION_PATCH:-0}
          PATCH=$((PATCH + 1))

          # Versionsnummer korrekt zusammensetzen
          VERSION="$MAJOR.$MINOR.$PATCH"

          # Git Hash (kurz)
          GIT_HASH=$(git rev-parse --short HEAD)

          echo "Computed Version: $VERSION"
          echo "Git Hash: $GIT_HASH"

          # Outputs setzen
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT

      - name: Show Docker tags
        run: |
          echo "Docker Tags:"
          echo "latest"
          echo "${{ steps.version.outputs.version }}"
          echo "${{ steps.version.outputs.version }}-${{ steps.version.outputs.hash }}"

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          file: Dockerfile
          push: true
          tags: |
            engineeringmethodsag/fluid-asset-connector-python:latest
            engineeringmethodsag/fluid-asset-connector-python:${{ steps.version.outputs.version }}-${{ steps.version.outputs.hash }}

      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Update VERSION_PATCH repository variable
        run: |
          echo "Updating VERSION_PATCH to ${{ steps.version.outputs.patch }}"
          curl -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $GITHUB_TOKEN_PAT" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/VERSION_PATCH \
            -d "{\"value\":\"${{ steps.version.outputs.patch }}\"}"
