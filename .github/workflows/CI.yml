name: CI

on:
  push:
    branches:
      - dk/dockerization-pipeline

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      VERSION_MAJOR_MINOR: ${{ vars.VERSION_MAJOR_MINOR }}
      VERSION_PATCH: ${{ vars.VERSION_PATCH }}
      GITHUB_TOKEN_PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          # Major/Minor sauber extrahieren
          MAJOR=$(echo $VERSION_MAJOR_MINOR | cut -d. -f1)
          MINOR=$(echo $VERSION_MAJOR_MINOR | cut -d. -f2)

          # Patch hochzählen (Default 0)
          PATCH=${VERSION_PATCH:-0}
          PATCH=$((PATCH + 1))

          # Versionsnummer korrekt zusammensetzen
          VERSION="$MAJOR.$MINOR.$PATCH"

          # Git Hash (kurz)
          GIT_HASH=$(git rev-parse --short HEAD)

          echo "Computed Version: $VERSION"
          echo "Git Hash: $GIT_HASH"

          # Outputs setzen
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT

